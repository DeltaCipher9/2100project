<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniFlow — Study Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="analytics">
<div class="shell">
  <div id="sidebar-mount"></div>
  <main class="main">
    <div class="page-head">
      <h1>Study Analytics</h1>
      <p class="sub">A quick read on workload pressure and how consistently you're clearing tasks.</p>
    </div>

    <div class="analytics-grid">
      <section>
        <div class="sec-head"><h2>Tasks completed — last 7 days</h2></div>
        <div class="form-card">
          <div class="bar-chart" id="bar-chart"></div>
          <p class="sub" id="velocity-label" style="margin-top:14px;"></p>
        </div>
      </section>

      <section>
        <div class="sec-head"><h2>Stress meter</h2></div>
        <div class="form-card">
          <div class="meter"><div id="stress-meter" style="width:0%;"></div></div>
          <p class="sub" id="stress-label" style="margin-top:0;"></p>
          <div style="font-family:'Fraunces',serif;font-size:28px;font-weight:600;margin-top:10px;" id="stress-pct">0%</div>
        </div>
      </section>
    </div>

    <section>
      <div class="sec-head"><h2>Progress by course</h2></div>
      <div class="form-card" id="course-progress"></div>
    </section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
