<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniFlow — Assignments & Tests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="tasks">
<div class="shell">
  <div id="sidebar-mount"></div>
  <main class="main">
    <div class="page-head">
      <h1>Assignments &amp; Tests</h1>
      <p class="sub">Every deadline in one filterable list — across all courses.</p>
    </div>

    <section>
      <div class="sec-head"><h2>Add a task</h2></div>
      <form class="form-card" id="task-form">
        <div class="form-row">
          <div><label class="field-label">Task</label><input type="text" id="t-name" placeholder="e.g. Assignment 3" required></div>
          <div><label class="field-label">Course</label><select id="t-course"></select></div>
          <div><label class="field-label">Due date</label><input type="date" id="t-due" required></div>
          <div><label class="field-label">Priority</label>
            <select id="t-priority">
              <option value="high">High</option>
              <option value="mid" selected>Medium</option>
              <option value="low">Low</option>
            </select>
          </div>
        </div>
        <button class="primary" type="submit">Add task</button>
      </form>
    </section>

    <section>
      <div class="sec-head">
        <h2>All tasks</h2>
        <div class="filters">
          <select id="filter-course"></select>
          <select id="filter-status">
            <option value="all">All statuses</option>
            <option value="pending">Pending</option>
            <option value="done">Done</option>
          </select>
        </div>
      </div>
      <table>
        <thead><tr><th>Task</th><th>Course</th><th>Due</th><th>Status</th><th></th></tr></thead>
        <tbody id="tasks-body"></tbody>
      </table>
    </section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
